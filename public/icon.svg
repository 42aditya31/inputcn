<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="inputcn">
  <title>inputcn</title>

  <!-- Same mark as favicon.png, drawn as geometry so it stays sharp at 16px
       and costs a few hundred bytes instead of 1.1 MB. -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0b0b0e" stroke="#2a2a33" stroke-width="1"/>

  <!-- i -->
  <circle cx="16.8" cy="17.6" r="3.3" fill="#f4f4f5"/>
  <rect x="13.9" y="22.4" width="5.8" height="19.2" rx="0.8" fill="#f4f4f5"/>

  <!-- the slash, the one piece of colour -->
  <path d="M31.2 18.6 L35.4 18.6 L25.6 45.8 L21.4 45.8 Z" fill="#cdf25c"/>

  <!-- c -->
  <path d="M47.5 30.1 A6.9 6.9 0 1 0 47.5 41.3"
        fill="none" stroke="#f4f4f5" stroke-width="5.2" stroke-linecap="round"/>
